
name: Deploy Ionic Vue to Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: |
          docker --version
          docker compose version

      - name: Build and Run Docker Container
        shell: powershell
        run: |
          docker compose up -d --build --force-recreate
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed."
          }

      - name: Verify Deployment and Get Application URL
        shell: powershell
        run: |
          $containerId = (docker compose ps -q ionic-vue).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($containerId)) {
            throw "The ionic-vue container is not running."
          }

          $applicationUrl = "http://localhost:8080"
          $ready = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $applicationUrl -TimeoutSec 5 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) {
            throw "The application did not respond successfully at $applicationUrl."
          }

          $route = Get-NetRoute -DestinationPrefix "0.0.0.0/0" -ErrorAction SilentlyContinue |
            Sort-Object RouteMetric |
            Select-Object -First 1

          $serverIP = $null
          if ($route) {
            $serverIP = Get-NetIPAddress -InterfaceIndex $route.InterfaceIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object { $_.IPAddress -notmatch '^(127\.|169\.254\.)' } |
              Select-Object -First 1 -ExpandProperty IPAddress
          }

          if ([string]::IsNullOrWhiteSpace($serverIP)) {
            Write-Warning "Could not determine the runner's LAN IP. The app is reachable from the runner at $applicationUrl."
            $reportedUrl = $applicationUrl
            $reportedIP = "Unavailable"
          } else {
            $reportedUrl = "http://${serverIP}:8080"
            $reportedIP = $serverIP
          }

          Write-Host "Container ID: $containerId"
          Write-Host "Docker Host IP: $reportedIP"
          Write-Host "Application URL: $reportedUrl"

          Add-Content $env:GITHUB_STEP_SUMMARY "## Docker Deployment Successful"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Container ID: $containerId"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Server IP: $reportedIP"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Application URL: $reportedUrl"
